apiVersion: v1
kind: Pod
metadata:
  name: escritor-tmp
  namespace: reservas-app
spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo previo > /datos/viejo.txt"]
      volumeMounts:
        - name: datos
          mountPath: /datos
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: reservas-db-pvc
