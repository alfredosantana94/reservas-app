apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-api
  namespace: reservas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      run: reservas-api
  template:
    metadata:
      labels:
        run: reservas-api
    spec:
      containers:
        - name: reservas-api
          image: alfredosantana94/reservas-api:v1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: reservas-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_PASSWORD
