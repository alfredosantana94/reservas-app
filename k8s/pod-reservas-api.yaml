apiVersion: v1
kind: Pod
metadata:
  labels:
    run: reservas-api
  name: reservas-api
  namespace: reservas-app
spec:
  containers:
  - image: alfredosantana94/reservas-api:v1
    name: reservas-api
    ports:
    - containerPort: 3000
      protocol: TCP
    env:
    - name: DB_HOST
      value: reservas-db
    - name: DB_PORT
      value: "3306"
    - name: DB_NAME
      value: reservasdb
    - name: DB_USER
      value: reservas_user
    - name: DB_PASSWORD
      value: reservas_pass
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}